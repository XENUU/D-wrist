<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060606">
  <meta name="description" content="D-wrist — bibliothèque de morceaux.">
  <title>D-wrist</title>

  <!-- Polices : Inter (texte courant) + UnifrakturMaguntia (logo gothique) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Couches d'ambiance (décor, non interactives) ===== -->
  <div class="ambiance" aria-hidden="true">
    <div class="light light--1"></div>
    <div class="light light--2"></div>
    <div class="light light--3"></div>
    <div class="light light--4"></div>
  </div>
  <!-- Fond flouté de la cover en cours (visible sur la page musique) -->
  <div class="backdrop" aria-hidden="true"><img id="backdropImg" alt=""></div>
  <!-- Ambiance propre au morceau (champ « mood » dans tracks.js) -->
  <div class="mood" aria-hidden="true">
    <!-- « stage » : projecteurs, fumée et flashs (créés en JS) -->
    <div class="rig">
      <div class="bw"><div class="beam beam--1"></div></div>
      <div class="bw"><div class="beam beam--2"></div></div>
      <div class="bw"><div class="beam beam--3"></div></div>
      <div class="bw"><div class="beam beam--4"></div></div>
    </div>
    <div class="smoke"></div>
    <div class="flashes" id="flashes"></div>
    <div class="bloom" id="bloom"></div>
    <div class="stage-scrim"></div>
    <!-- « vice » : coucher de soleil, horizon et palmiers -->
    <div class="vice">
      <div class="sun"></div>
      <div class="horizon"></div>
      <svg class="palm palm--1" viewBox="0 0 46 70"><path d="M24 70C23 50 22 35 24 22" stroke="currentColor" stroke-width="2.4" fill="none"/><path d="M24 22C14 14 6 16 1 22C9 17 17 18 24 22C18 10 10 6 4 7C12 9 19 13 24 22C26 11 33 5 42 6C34 9 28 14 24 22C33 16 40 18 45 24C38 19 31 19 24 22Z" fill="currentColor"/></svg>
      <svg class="palm palm--2" viewBox="0 0 46 70"><path d="M24 70C23 50 22 35 24 22" stroke="currentColor" stroke-width="2.4" fill="none"/><path d="M24 22C14 14 6 16 1 22C9 17 17 18 24 22C18 10 10 6 4 7C12 9 19 13 24 22C26 11 33 5 42 6C34 9 28 14 24 22C33 16 40 18 45 24C38 19 31 19 24 22Z" fill="currentColor"/></svg>
    </div>
    <!-- « vice » aussi : HUD de jeu (compteur de cash, minimap) -->
    <div class="hud">
      <div class="hud-cash" id="hudCash">$0</div>
      <div class="hud-map"></div>
    </div>
  </div>

  <!-- ===== Vue ACCUEIL : logo + carrousel ===== -->
  <main id="home" class="view view--home">
    <header class="logo">
      <a href="#" class="logo-link" aria-label="D-wrist — accueil">
        <!-- Si assets/logo.png existe, il s'affiche et remplace le texte.
             Sinon l'image se supprime d'elle-même et le texte chromé reste. -->
        <img class="logo-img" src="assets/logo.png" alt="D-wrist"
             onload="this.closest('.logo').classList.add('has-img')"
             onerror="this.remove()">
        <span class="logo-text" data-text="D-wrist">D-wrist</span>
      </a>
    </header>

    <section class="carousel" id="carousel" tabindex="0"
             aria-roledescription="carrousel" aria-label="Morceaux de D-wrist">
      <div class="carousel-track" id="carouselTrack"></div>
    </section>

    <div class="caption" id="caption" aria-live="polite">
      <h2 class="caption-title" id="captionTitle"></h2>
      <p class="caption-artist" id="captionArtist">D-wrist</p>
    </div>

    <p class="hint" id="hint">glisse&nbsp;·&nbsp;clique</p>

    <!-- Bascule vers la vue Album -->
    <a class="view-switch" href="#album" aria-label="Vue album">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Album</span>
    </a>
  </main>

  <!-- ===== Vue ALBUM : tracklist verticale, ordre modifiable (mot de passe) ===== -->
  <section id="album" class="view view--album" aria-label="Album" hidden>
    <a class="view-switch" href="#" aria-label="Retour au carrousel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="5" width="8" height="14" rx="1.5"/><path d="M4 7v10M20 7v10"/></svg>
      <span>Découvrir</span>
    </a>

    <div class="album-scroll" id="albumScroll">
      <header class="album-head">
        <div class="album-art" id="albumArt"></div>
        <div class="album-meta">
          <p class="album-kicker">Album</p>
          <h1 class="album-title" id="albumTitle">Album</h1>
          <p class="album-sub" id="albumSub">D-wrist</p>
          <div class="album-actions">
            <button class="album-play" id="albumPlay" type="button" aria-label="Lire l'album">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.53.85l10.2-6.4a1 1 0 0 0 0-1.7L9.53 4.75A1 1 0 0 0 8 5.6z"/></svg>
            </button>
            <button class="album-edit" id="albumEdit" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              <span>Modifier</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Barre d'édition (visible une fois déverrouillé) -->
      <div class="album-tools" id="albumTools" hidden>
        <p class="album-status" id="albumStatus"></p>
        <div class="album-tools-btns">
          <button type="button" id="albumReset">Annuler mes changements</button>
          <button type="button" id="albumExport" class="is-main">Enregistrer album.js</button>
          <button type="button" id="albumLock">Terminer</button>
        </div>
      </div>

      <ol class="tracklist" id="tracklist"></ol>

      <div class="album-out" id="albumOut" hidden>
        <p class="album-out-label">Hors tracklist</p>
        <ul class="tracklist tracklist--out" id="tracklistOut"></ul>
      </div>
    </div>

    <!-- Mini-lecteur : le morceau joue sans quitter la tracklist -->
    <div class="mini" id="mini" hidden>
      <div class="mini-progress" id="miniProgress" role="slider" tabindex="0"
           aria-label="Position de lecture" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="mini-rail"><div class="mini-fill" id="miniFill"></div></div>
      </div>
      <div class="mini-row">
        <img class="mini-cover" id="miniCover" alt="">
        <div class="mini-meta">
          <span class="mini-title" id="miniTitle"></span>
          <span class="mini-time" id="miniTime">0:00 / 0:00</span>
        </div>
        <div class="mini-btns">
          <button class="mini-btn mini-btn--side" id="miniPrev" type="button" aria-label="Morceau précédent">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6z"/><path d="M19 6.3v11.4a1 1 0 0 1-1.55.83l-8.1-5.7a1.04 1.04 0 0 1 0-1.66l8.1-5.7A1 1 0 0 1 19 6.3z"/></svg>
          </button>
          <button class="mini-btn mini-btn--play" id="miniPlay" type="button" aria-label="Lecture">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.53.85l10.2-6.4a1 1 0 0 0 0-1.7L9.53 4.75A1 1 0 0 0 8 5.6z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
          </button>
          <button class="mini-btn mini-btn--side" id="miniNext" type="button" aria-label="Morceau suivant">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2z"/><path d="M5 6.3v11.4a1 1 0 0 0 1.55.83l8.1-5.7a1.04 1.04 0 0 0 0-1.66l-8.1-5.7A1 1 0 0 0 5 6.3z"/></svg>
          </button>
          <button class="mini-btn mini-btn--side mini-repeat" id="miniRepeat" type="button" aria-label="Répéter : non">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg>
            <span class="mini-repeat-one">1</span>
          </button>
          <button class="mini-lyrics" id="miniLyrics" type="button" aria-label="Voir les paroles">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 11h16M4 16h9"/><path d="M18 14v6"/><circle cx="16.4" cy="20" r="1.6"/></svg>
            <span>Paroles</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Mot de passe pour modifier la tracklist -->
  <div class="lock" id="lock" hidden>
    <form class="lock-box" id="lockForm" autocomplete="off">
      <p class="lock-title">Modifier la tracklist</p>
      <input class="lock-input" id="lockInput" type="password" placeholder="Mot de passe" aria-label="Mot de passe">
      <div class="lock-btns">
        <button type="button" id="lockCancel">Annuler</button>
        <button type="submit" class="is-main">Déverrouiller</button>
      </div>
    </form>
  </div>

  <!-- ===== Vue MUSIQUE : lecteur + paroles ===== -->
  <section id="player" class="view view--player" aria-label="Lecteur" hidden>
    <header class="topbar">
      <button class="back-btn" id="backBtn" type="button" aria-label="Retour à la bibliothèque">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="now" id="playerHead">
        <img class="player-cover" id="playerCover" alt="">
        <h1 class="now-text" id="playerMeta">
          <span class="now-title" id="playerTitle"></span>
          <span class="now-sep">&nbsp;—&nbsp;</span>
          <span class="now-artist" id="playerArtist">D-wrist</span>
        </h1>
      </div>
    </header>

    <div class="lyrics" id="lyrics">
      <div class="lyrics-inner" id="lyricsInner"></div>
    </div>

    <footer class="controls" id="controls">
      <div class="progress" id="progress" role="slider" tabindex="0"
           aria-label="Position de lecture" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-thumb-wrap" id="progressThumb"><span class="progress-thumb"></span></div>
      </div>
      <div class="times">
        <span id="timeCurrent">0:00</span>
        <span id="timeTotal">0:00</span>
      </div>
      <div class="buttons">
        <button class="ctrl" id="prevBtn" type="button" aria-label="Morceau précédent">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6z"/><path d="M19 6.3v11.4a1 1 0 0 1-1.55.83l-8.1-5.7a1.04 1.04 0 0 1 0-1.66l8.1-5.7A1 1 0 0 1 19 6.3z"/></svg>
        </button>
        <button class="ctrl ctrl--play" id="playBtn" type="button" aria-label="Lecture">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.53.85l10.2-6.4a1 1 0 0 0 0-1.7L9.53 4.75A1 1 0 0 0 8 5.6z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
        </button>
        <button class="ctrl" id="nextBtn" type="button" aria-label="Morceau suivant">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2z"/><path d="M5 6.3v11.4a1 1 0 0 0 1.55.83l8.1-5.7a1.04 1.04 0 0 0 0-1.66l-8.1-5.7A1 1 0 0 0 5 6.3z"/></svg>
        </button>
      </div>
    </footer>
  </section>

  <!-- Vignettage + grain argentique par-dessus tout -->
  <!-- Scintillements « diamants » (au-dessus des paroles) -->
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Message temporaire (ex. fichier audio introuvable) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Un seul lecteur audio, qui ne précharge que les métadonnées -->
  <audio id="audio" preload="metadata"></audio>

  <!-- Données d'abord, puis le script principal (pas de fetch : marche en file://) -->
  <script src="tracks.js"></script>
  <script src="album.js"></script>
  <script src="script.js"></script>
</body>
</html>
