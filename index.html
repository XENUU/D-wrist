<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060606">
  <meta name="description" content="D-wrist — bibliothèque de morceaux.">
  <title>D-wrist</title>

  <!-- Polices : Inter (texte courant) + UnifrakturMaguntia (logo gothique) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Couches d'ambiance (décor, non interactives) ===== -->
  <div class="ambiance" aria-hidden="true">
    <div class="light light--1"></div>
    <div class="light light--2"></div>
    <div class="light light--3"></div>
    <div class="light light--4"></div>
  </div>
  <!-- Fond flouté de la cover en cours (visible sur la page musique) -->
  <div class="backdrop" aria-hidden="true"><img id="backdropImg" alt=""></div>

  <!-- ===== Vue ACCUEIL : logo + carrousel ===== -->
  <main id="home" class="view view--home">
    <header class="logo">
      <a href="#" class="logo-link" aria-label="D-wrist — accueil">
        <!-- Si assets/logo.png existe, il s'affiche et remplace le texte.
             Sinon l'image se supprime d'elle-même et le texte chromé reste. -->
        <img class="logo-img" src="assets/logo.png" alt="D-wrist"
             onload="this.closest('.logo').classList.add('has-img')"
             onerror="this.remove()">
        <span class="logo-text" data-text="D-wrist">D-wrist</span>
      </a>
    </header>

    <section class="carousel" id="carousel" tabindex="0"
             aria-roledescription="carrousel" aria-label="Morceaux de D-wrist">
      <div class="carousel-track" id="carouselTrack"></div>
    </section>

    <div class="caption" id="caption" aria-live="polite">
      <h2 class="caption-title" id="captionTitle"></h2>
      <p class="caption-artist" id="captionArtist">D-wrist</p>
    </div>

    <p class="hint" id="hint">glisse&nbsp;·&nbsp;clique</p>
  </main>

  <!-- ===== Vue MUSIQUE : lecteur + paroles ===== -->
  <section id="player" class="view view--player" aria-label="Lecteur" hidden>
    <header class="topbar">
      <button class="back-btn" id="backBtn" type="button" aria-label="Retour à la bibliothèque">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="now" id="playerHead">
        <img class="player-cover" id="playerCover" alt="">
        <h1 class="now-text" id="playerMeta">
          <span class="now-title" id="playerTitle"></span>
          <span class="now-sep">&nbsp;—&nbsp;</span>
          <span class="now-artist" id="playerArtist">D-wrist</span>
        </h1>
      </div>
    </header>

    <div class="lyrics" id="lyrics">
      <div class="lyrics-inner" id="lyricsInner"></div>
    </div>

    <footer class="controls" id="controls">
      <div class="progress" id="progress" role="slider" tabindex="0"
           aria-label="Position de lecture" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-thumb-wrap" id="progressThumb"><span class="progress-thumb"></span></div>
      </div>
      <div class="times">
        <span id="timeCurrent">0:00</span>
        <span id="timeTotal">0:00</span>
      </div>
      <div class="buttons">
        <button class="ctrl" id="prevBtn" type="button" aria-label="Morceau précédent">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6z"/><path d="M19 6.3v11.4a1 1 0 0 1-1.55.83l-8.1-5.7a1.04 1.04 0 0 1 0-1.66l8.1-5.7A1 1 0 0 1 19 6.3z"/></svg>
        </button>
        <button class="ctrl ctrl--play" id="playBtn" type="button" aria-label="Lecture">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.53.85l10.2-6.4a1 1 0 0 0 0-1.7L9.53 4.75A1 1 0 0 0 8 5.6z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
        </button>
        <button class="ctrl" id="nextBtn" type="button" aria-label="Morceau suivant">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2z"/><path d="M5 6.3v11.4a1 1 0 0 0 1.55.83l8.1-5.7a1.04 1.04 0 0 0 0-1.66l-8.1-5.7A1 1 0 0 0 5 6.3z"/></svg>
        </button>
      </div>
    </footer>
  </section>

  <!-- Vignettage + grain argentique par-dessus tout -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Message temporaire (ex. fichier audio introuvable) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Un seul lecteur audio, qui ne précharge que les métadonnées -->
  <audio id="audio" preload="metadata"></audio>

  <!-- Données d'abord, puis le script principal (pas de fetch : marche en file://) -->
  <script src="tracks.js"></script>
  <script src="script.js"></script>
</body>
</html>
